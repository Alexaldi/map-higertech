# 1. HTTP Server (Port 80)
server {
    listen 80;
    server_name core8.higertech.com higertech.com www.higertech.com localhost;

    root /var/www/html/public;
    index index.php;

    client_max_body_size 20M;

    # Allow Let's Encrypt challenge verification (prioritas tertinggi)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html/public;
    }

    # Bypassed / Allowed HTTP tanpa redirect HTTPS:
    # Khusus untuk URL API telemetri & IoT (alat versi lama hanya mendukung HTTP plain)
    location ~ /api/ {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM handler untuk request API via HTTP
    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
    }

    # Seluruh URL web publik lainnya dialihkan otomatis ke HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS Server
server {
    listen 443 ssl;
    http2 on;
    server_name core8.higertech.com higertech.com www.higertech.com localhost;

    root /var/www/html/public;
    index index.php;

    # SSL Certificates
    ssl_certificate /etc/letsencrypt/live/core8.higertech.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/core8.higertech.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Max upload size (sesuai php.ini)
    client_max_body_size 20M;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 256;

    # Redirect /admin dan /admin/ ke /admin/dashboard
    # (Mencegah Nginx 403 Forbidden karena ada folder fisik public/admin/assets)
    location = /admin {
        return 301 /admin/dashboard;
    }
    location = /admin/ {
        return 301 /admin/dashboard;
    }

    # Laravel routing — semua ke index.php kecuali file statis
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM handler
    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
    }

    # Cache static assets
    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot|webp)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    # Deny .htaccess access
    location ~ /\.ht {
        deny all;
    }

    # Deny hidden files
    location ~ /\. {
        deny all;
    }
}

