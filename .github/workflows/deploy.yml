name: Deploy to VPS

on:
  push:
    branches:
      - master

jobs:
  deploy:
    name: Auto Deploy to Production VPS
    runs-on: ubuntu-latest

    steps:
      - name: SSH into VPS and Run Deploy Commands
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            echo "🚀 Memulai proses deploy..."
            cd ~/map-higertech

                        echo "📥 Menarik kode terbaru dari GitHub..."
            git checkout -- docker/nginx/default.conf 2>/dev/null || true
            git reset --hard HEAD
            git pull origin master

            echo "🔄 Refresh autoloading..."
            docker compose exec -T app composer dump-autoload

            echo "⚡ Membersihkan dan menyusun cache production..."
            docker compose exec -T app php artisan optimize:clear
            docker compose exec -T app php artisan optimize

            echo "🗄️ Menjalankan migrasi database..."
            docker compose exec -T app php artisan migrate --force

            echo "🔗 Memastikan tautan storage terhubung..."
            docker compose exec -T app php artisan storage:link 2>/dev/null || true

            echo "📦 Build asset frontend..."
            docker compose exec -T app npm run build

            echo "🔄 Restart PHP application & reload Nginx..."
            docker compose restart app
            docker compose exec -T nginx nginx -s reload || docker compose restart nginx
